<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GOVORNICA</title>
<style>
:root{
  --bg:#f1eee5;
  --ink:#11100e;
  --muted:#777168;
  --soft:rgba(17,16,14,.18);
  --font:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font)}
body{min-height:100vh;padding:16px}
.page{width:min(78ch,100%);min-height:calc(100vh - 32px);margin:0 auto;display:grid;grid-template-rows:auto 1fr auto;gap:18px}
header,footer,.panel,.output{border:1px solid var(--ink)}
header,footer{display:flex;justify-content:space-between;gap:16px;padding:7px 9px;font-size:12px;text-transform:lowercase}
.muted,#state{color:var(--muted)}
main{display:grid;align-content:center;gap:18px}
.identity{padding:0 1px}
.kicker{font-size:12px;color:var(--muted);letter-spacing:.02em;text-transform:lowercase}
h1{margin:5px 0 0;font-weight:400;font-size:clamp(42px,9vw,104px);line-height:.82;letter-spacing:-.075em;text-transform:lowercase}
.panel{padding:9px}
label{display:block;margin:0 0 8px;color:var(--muted);font-size:12px;text-transform:lowercase}
textarea{display:block;width:100%;height:108px;resize:none;border:1px solid var(--ink);border-radius:0;background:rgba(255,255,255,.16);color:var(--ink);padding:9px;font:inherit;font-size:14px;line-height:1.45;outline:none;caret-color:var(--ink)}
textarea:focus{box-shadow:inset 0 0 0 1px var(--ink)}
.controls{margin-top:9px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12px;color:var(--muted)}
button{border:1px solid var(--ink);border-radius:0;background:transparent;color:var(--ink);font:inherit;font-size:12px;padding:6px 12px;cursor:pointer;text-transform:lowercase}
button:hover,button:focus-visible{background:var(--ink);color:var(--bg)}
button:disabled{opacity:.32;cursor:default}
.output{min-height:230px;margin:0;padding:9px;background:transparent;white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;font-size:13px;line-height:1.55}
.cursor::after{content:"_";animation:blink 1s steps(2,start) infinite}
@keyframes blink{50%{opacity:0}}
::selection{background:var(--ink);color:var(--bg)}
@media(max-width:560px){body{padding:10px}.page{min-height:calc(100vh - 20px)}header,footer{font-size:11px}h1{font-size:clamp(38px,15vw,76px)}}
</style>
</head>
<body>
<div class="page">
  <header>
    <span>govornica / lokalno</span>
    <span id="state">čeka</span>
  </header>

  <main>
    <section class="identity" aria-label="stanje rada">
      <div class="kicker">govornica</div>
      <h1>čuto / nije zadržano</h1>
    </section>

    <section class="panel" aria-label="unos iskaza">
      <label for="statement">upiši jednu rečenicu koju pristaješ da izgubiš</label>
      <textarea id="statement" maxlength="220" spellcheck="false" autocomplete="off" aria-label="rečenica"></textarea>
      <div class="controls">
        <button id="speak" type="button">govori</button>
        <span id="count">0/220</span>
      </div>
    </section>

    <pre id="output" class="output" aria-live="polite">[ nema događaja ]</pre>
  </main>

  <footer>
    <span>bez čuvanja</span>
    <span class="muted">metod: rasipanje</span>
  </footer>
</div>

<script>
(() => {
  "use strict";

  const textarea = document.querySelector("#statement");
  const speak = document.querySelector("#speak");
  const output = document.querySelector("#output");
  const state = document.querySelector("#state");
  const count = document.querySelector("#count");

  const LIMIT = 220;
  const MARKS = ["[praznina]", "[kasni]", "[ne drži]", "[nedostaje]", "[nije dokaz]", "[talog]"];

  // GOVORNICA:
  // unos -> uklanjanje originala -> skidanje interpunkcije -> izostavljanje
  // -> grupisanje -> rasipanje -> povremeno ponavljanje -> spori izlaz
  // -> nestanak taloga -> ponovni početak
  // Nema localStorage/sessionStorage, kolačića, mrežnih zahteva niti zapisivanja fajla.

  function normalise(text) {
    return text.replace(/[<>]/g, "").replace(/\s+/g, " ").trim();
  }

  function words(text) {
    return normalise(text)
      .replace(/[.,!?;:()\[\]{}"“”‘’…—–-]/g, "")
      .split(" ")
      .filter(Boolean);
  }

  function choose(list) {
    return list[Math.floor(Math.random() * list.length)];
  }

  function omit(list) {
    if (list.length < 4) return [...list];
    return list.filter((_, i) => i === 0 || i === list.length - 1 || Math.random() > 0.34);
  }

  function groups(list) {
    const result = [];
    for (let i = 0; i < list.length;) {
      const size = Math.min(list.length - i, 1 + Math.floor(Math.random() * 3));
      result.push(list.slice(i, i + size).join(" "));
      i += size;
    }
    return result;
  }

  function disperse(fragment) {
    const indent = " ".repeat(Math.floor(Math.random() * 8));
    if (fragment.length > 7 && Math.random() > 0.58) {
      fragment = [...fragment].map(ch => ch === " " ? "   " : ch).join(Math.random() > 0.5 ? " " : "");
    }
    return indent + fragment;
  }

  function makeResidue(text) {
    const pieces = groups(omit(words(text)));
    const fixation = pieces.length ? choose(pieces) : "";
    const markA = choose(MARKS);
    const markB = choose(MARKS.filter(m => m !== markA));
    const lines = [
      `događaj ${Math.floor(10000 + Math.random() * 90000)}`,
      "unos uklonjen",
      "--"
    ];

    pieces.forEach((piece, i) => {
      if (i === 1) lines.push(markA);
      lines.push(disperse(piece));
      if (piece === fixation && Math.random() > 0.28) lines.push(disperse(piece));
      if (i === Math.max(2, pieces.length - 2)) lines.push(markB);
    });

    lines.push("--", "čuto / nije zadržano");
    return lines;
  }

  function reset() {
    output.classList.remove("cursor");
    output.textContent = "[ nema događaja ]";
    state.textContent = "čeka";
    textarea.disabled = false;
    speak.disabled = false;
    textarea.focus();
  }

  function dissolve(lines) {
    const remaining = [...lines];
    state.textContent = "nestaje";
    const timer = setInterval(() => {
      remaining.pop();
      output.textContent = remaining.join("\n");
      if (!remaining.length) {
        clearInterval(timer);
        setTimeout(reset, 420);
      }
    }, 150);
  }

  function writeSlow(lines) {
    output.textContent = "";
    output.classList.add("cursor");
    let i = 0;

    function next() {
      if (i >= lines.length) {
        output.classList.remove("cursor");
        state.textContent = "nerazrešeno";
        setTimeout(() => dissolve(lines), 6000);
        return;
      }
      output.textContent += (i ? "\n" : "") + lines[i];
      i += 1;
      setTimeout(next, 300 + Math.random() * 140);
    }
    next();
  }

  function run() {
    const input = normalise(textarea.value);
    if (!input) {
      state.textContent = "prazno";
      textarea.focus();
      return;
    }

    // Original prestaje da bude dostupan pre nego što se pojavi izlaz.
    const residue = makeResidue(input);
    textarea.value = "";
    count.textContent = `0/${LIMIT}`;
    textarea.disabled = true;
    speak.disabled = true;
    state.textContent = "radi";
    writeSlow(residue);
  }

  textarea.addEventListener("input", () => {
    count.textContent = `${textarea.value.length}/${LIMIT}`;
    if (state.textContent === "prazno") state.textContent = "čeka";
  });

  textarea.addEventListener("keydown", event => {
    if ((event.ctrlKey || event.metaKey) && event.key === "Enter") run();
  });
  speak.addEventListener("click", run);
})();
</script>
</body>
</html>
